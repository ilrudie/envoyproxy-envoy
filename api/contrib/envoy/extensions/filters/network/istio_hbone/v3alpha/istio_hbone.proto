syntax = "proto3";

package envoy.extensions.filters.network.istio_hbone.v3alpha;

import "envoy/config/cluster/v3/cluster.proto";
import "envoy/extensions/filters/network/tcp_proxy/v3/tcp_proxy.proto";
import "envoy/extensions/transport_sockets/internal_upstream/v3/internal_upstream.proto";

import "google/protobuf/duration.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.network.istio_hbone.v3alpha";
option java_outer_classname = "IstioHboneProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/contrib/envoy/extensions/filters/network/istio_hbone/v3alpha";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Istio HBONE origination shim]

// Terminal filter for a single-HBONE origination internal listener. Use together
// with UpstreamConfig on the cluster connecting to this listener. The upstream
// cluster must use HTTP/2 and configure the required HBONE mutual TLS context.
// [#extension: envoy.filters.network.istio_hbone]
message Config {
  // TCP proxy settings. HTTP CONNECT tunneling and immediate upstream connection
  // establishment are required. Application TLS and PROXY protocol wrapping of
  // the internal connection are not supported by this shim.
  envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy tcp_proxy = 1
      [(validate.rules).message = {required: true}];
}

// Transport socket for clusters whose endpoints are HBONE origination internal
// listeners using Config. Holds connection readiness and all application bytes
// until the peer filter receives a successful CONNECT response.
// [#extension: envoy.transport_sockets.istio_hbone]
message UpstreamConfig {
  // Metadata to pass to the internal listener, including original destination
  // metadata when required by the listener's original destination filter.
  repeated envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
      .MetadataValueSource passthrough_metadata = 1;
}

// Optional protocol options on the outer HBONE HTTP/2 cluster. Records peer
// GOAWAY notifications for GoAwayLoadBalancingConfig without changing the
// lifetime of accepted CONNECT streams.
// [#extension: envoy.upstream_options.istio_hbone]
message GoAwayOptions {
  // How long to prefer other destinations after receiving GOAWAY. Defaults to
  // 30 seconds. Repeated GOAWAY frames on one connection do not extend this time.
  google.protobuf.Duration cooldown = 1 [(validate.rules).duration = {
    gt {}
    lte {seconds: 300}
  }];
}

// Optional service-cluster load balancing policy paired with GoAwayOptions.
// The preference is shared across workers and clusters in this Envoy process.
// It does not change endpoint health or close existing application connections.
// [#extension: envoy.load_balancing_policies.istio_hbone]
message GoAwayLoadBalancingConfig {
  // The existing endpoint selection policy. This proof of concept supports round robin,
  // least request, and random. Its health, locality, priority and weight settings
  // continue to apply.
  envoy.config.cluster.v3.LoadBalancingPolicy child_policy = 1
      [(validate.rules).message = {required: true}];

  // Maximum candidate selections before accepting the child's final choice.
  // Defaults to 16. A larger caller-supplied host selection retry budget is preserved.
  // These are local selections, not network connection attempts.
  // This bounds work and allows progress even when all candidates have sent GOAWAY.
  uint32 max_selection_attempts = 2 [(validate.rules).uint32 = {lte: 256}];

  // Match the outer original-destination cluster's port override (15008 in
  // Istio). Zero preserves the port in the endpoint's original-destination
  // metadata. Only internal endpoints with that metadata are considered.
  uint32 upstream_port_override = 3 [(validate.rules).uint32 = {lte: 65535}];
}
